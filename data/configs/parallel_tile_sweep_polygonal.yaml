# Parallel multirun for visually comparing the polygonal preset against the original look.
# Sweeps tile_size 5..18 (skipping <5 px since the algorithm degenerates below that).
# Output PNG matches input pixel size (match_input_size).
# Run: python main.py -m --config-name=parallel_tile_sweep_polygonal
defaults:
  - match_input_size
  - polygonal_tiles
  - override hydra/launcher: joblib

image_path: coffee_cup.png
edge_extraction_method: sobel
interactive_edge_modification: false
save_intermediate_steps: false

hydra:
  mode: MULTIRUN
  run:
    dir: ${output_folder}/${now:%Y.%m.%d-%H-%M-%S}
  sweep:
    dir: ${output_folder}/multirun_polygonal_${now:%Y.%m.%d-%H-%M-%S}
    subdir: run_${hydra.job.num}
  sweeper:
    params:
      tile_size: 5,9,12,15,18
