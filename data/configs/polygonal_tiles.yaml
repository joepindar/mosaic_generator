# Sharp, Roman-mosaic-style tiles closer to the look in
# https://towardsdatascience.com/how-to-generate-roman-style-mosaics-with-python-11d5aa021b09/
#
# What this preset changes vs. `default`:
#   - shrink_join_style: 2  -> mitred negative buffer keeps polygonal corners
#                              (default is round, which rounds every corner).
#   - convex_repair: true   -> two-stage repair: spike removal + near-convex hull
#                              replacement (default is off).
#   - skip_thin_polygons    -> mirrors the upstream "skip very thin section" guard.
#   - simplify_tolerance_factor: 0.15 -> stronger simplify pass; collapses tiny
#                              concavities and antialiased corner artefacts.
#   - tile_edge_lw: 0.15    -> finer tile outline; less halo at small tile sizes.
#   Gap filling and colour sampling inherit the article-style defaults from
#   default.yaml: gap_guideline_method=distance_stripes, gap_tile_placement=square,
#   coloring_sample=polygon_mean.
#
# Combine with `match_input_size` and a higher `output_dpi` (e.g. 192) for crisp output.
defaults:
  - default

shrink_tiles: true
shrink_buffer_factor: 0.03
shrink_join_style: 2
convex_repair: true
convex_repair_threshold: 0.92
simplify_tolerance_factor: 0.15
skip_thin_polygons: true
tile_edge_lw: 0.15
tile_edge_color: black
